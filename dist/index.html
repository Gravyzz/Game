    <style>
      @font-face {
        font-family: 'Press Start 2P';
        src: url('fonts/PressStart2P-Regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      /* Сброс — чистый канвас, без скролла, без зума */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #5a54f9;
        font-family: 'Onest', system-ui, sans-serif;
        color: #faf7f0;
        /* Запрещаем долгий тап с меню iOS, выделение текста, callout */
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }

      #app {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #5a54f9;
      }

      #app::before,
      #page-stars {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      #app::before {
        background:
          linear-gradient(120deg, rgba(118, 109, 255, 0.55), transparent 52%),
          linear-gradient(250deg, rgba(66, 61, 212, 0.38), transparent 58%);
        animation: app-bg-pulse 3.2s ease-in-out infinite alternate;
        z-index: 0;
      }

      #page-stars {
        z-index: 1;
        overflow: hidden;
      }

      #page-stars span {
        position: absolute;
        top: -90px;
        left: var(--x);
        width: var(--size);
        aspect-ratio: 1;
        background: url('assets/star-pixel.png') center / contain no-repeat;
        image-rendering: pixelated;
        opacity: var(--opacity);
        animation: page-star-fall var(--duration) linear var(--delay) infinite;
        transform: translate3d(0, -120px, 0) rotate(var(--rotation));
      }

      #app canvas {
        position: relative;
        z-index: 2;
        display: block;
        max-width: 100vw;
        max-height: 100vh;
      }

      @keyframes app-bg-pulse {
        from {
          opacity: 0.12;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes page-star-fall {
        from {
          transform: translate3d(0, -140px, 0) rotate(var(--rotation));
        }
        to {
          transform: translate3d(var(--drift), calc(100vh + 180px), 0) rotate(calc(var(--rotation) + var(--spin)));
        }
      }

      /* Лоадер до загрузки Phaser — чтобы не пустой чёрный экран на старте */
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background:
          linear-gradient(120deg, rgba(118, 109, 255, 0.55), transparent 52%),
          linear-gradient(250deg, rgba(66, 61, 212, 0.38), transparent 58%),
          #5a54f9;
        color: #faf7f0;
        font-family: 'Press Start 2P', monospace;
        font-weight: 400;
        font-size: 24px;
        line-height: 1.55;
        text-align: center;
        z-index: 100;
        transition: opacity 0.4s;
        animation: app-bg-pulse 3.2s ease-in-out infinite alternate;
      }

      #boot-loader::before {
        content: '';
        position: fixed;
        inset: -160px 0 0;
        pointer-events: none;
        background-image: url('assets/star-pixel.png'), url('assets/star-pixel.png');
        background-repeat: repeat;
        background-size: 220px 220px, 310px 310px;
        background-position: 24px 0, 140px -90px;
        opacity: 0.55;
        animation: app-stars-fall 8s linear infinite;
      }

      #boot-loader > div {
        position: relative;
        z-index: 1;
        max-width: 680px;
      }

      #boot-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }

    </style>
