<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="format-detection" content="telephone=no" />

    <title>Make Love Adventures</title>

    <!-- Шрифты: локальный Press Start 2P — пиксельный UI, Unbounded/Onest — старые экраны -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Onest:wght@400;600;800&display=swap"
      rel="stylesheet"
    />

    <style>
      @font-face {
        font-family: 'Press Start 2P';
        src: url('/fonts/PressStart2P-Regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      /* Сброс — чистый канвас, без скролла, без зума */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0a;
        font-family: 'Onest', system-ui, sans-serif;
        color: #faf7f0;
        /* Запрещаем долгий тап с меню iOS, выделение текста, callout */
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }

      #app {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
      }

      #app canvas {
        display: block;
        max-width: 100vw;
        max-height: 100vh;
      }

      /* Лоадер до загрузки Phaser — чтобы не пустой чёрный экран на старте */
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #ff2e2e;
        color: #0a0a0a;
        font-family: 'Unbounded', sans-serif;
        font-weight: 900;
        font-style: italic;
        font-size: 28px;
        letter-spacing: -0.02em;
        z-index: 100;
        transition: opacity 0.4s;
      }

      #boot-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }

      #boot-loader .dots::after {
        content: '';
        display: inline-block;
        animation: dots 1.2s infinite;
      }

      @keyframes dots {
        0%, 20%   { content: ''; }
        40%       { content: '.'; }
        60%       { content: '..'; }
        80%, 100% { content: '...'; }
      }
    </style>
  </head>
  <body>
    <!-- Сюда Phaser отрендерит canvas -->
    <div id="app"></div>

    <!-- Брендовый прелоадер до того, как загрузится Phaser-бандл -->
    <div id="boot-loader">
      <div>ЙОУ</div>
      <div class="dots" style="font-size: 16px; font-weight: 600;">грузим пиццулю</div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
