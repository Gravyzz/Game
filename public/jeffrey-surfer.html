<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
  <title>Серфёр Джеффри</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0604;
      width: 100vw; height: 100vh; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    canvas { display: block; touch-action: none; }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// ============================================================
// CONSTANTS
// ============================================================
const IS_IFRAME = window.parent !== window;

const GOAL_SCORE = 100;
const GOAL_PIZZA = 5;

const CANVAS_W = 720;
const CANVAS_H = 1280;
const NUM_LANES = 5;
const LANE_TOP = 300;
const LANE_H = 180;
const LANE_CENTERS = Array.from({ length: NUM_LANES }, (_, i) => LANE_TOP + i * LANE_H + LANE_H / 2);

const JEFFREY_X = 180;
const TILE_STEP = 110;
const BASE_JUMP_MS = 220;
const MIN_GAP = 180;
const MAX_GAP = 480;
const SPAWN_AHEAD = CANVAS_W * 2.2;
const PIZZA_INTERVAL = 700;

// Lane 0,4 = sidewalk; 1,3 = traffic left; 2 = traffic right
const LANE_TYPE   = ['walk','road','road','road','walk'];
const LANE_DIR    = [0, -1, 1, -1, 0];

const C = {
  red:      '#E63946',
  orange:   '#F4A261',
  green:    '#2D6A4F',
  cream:    '#FFF8E7',
  yellow:   '#FFD166',
  dark:     '#1A1209',
  skin:     '#FDBCB4',
  asphalt:  '#363636',
  sidewalk: '#B5A898',
  skyTop:   '#4A88C0',
  skyBot:   '#B8DDF5',
  white:    '#FFFFFF',
  black:    '#000000',
};

const BCOLORS = [C.red, C.orange, C.green, '#7B5E3A', '#5A7A8B', '#7A5A8B', '#3A7A5A'];
const SIGNS   = ['PIZZERIA', 'PIZZA 🍕', 'MLP', 'RISTORANTE', null, null];

// ============================================================
// CANVAS SETUP
// ============================================================
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
canvas.width  = CANVAS_W;
canvas.height = CANVAS_H;

function resize() {
  const s = Math.min(innerWidth / CANVAS_W, innerHeight / CANVAS_H);
  canvas.style.width  = CANVAS_W * s + 'px';
  canvas.style.height = CANVAS_H * s + 'px';
  canvas.style.position = 'absolute';
  canvas.style.left = (innerWidth  - CANVAS_W * s) / 2 + 'px';
  canvas.style.top  = (innerHeight - CANVAS_H * s) / 2 + 'px';
}
addEventListener('resize', resize);
resize();

// ============================================================
// GAME STATE
// ============================================================
let mode      = null;    // 'task' | 'record'
let screen    = 'start'; // 'start'|'playing'|'paused'|'dead'|'win'
let score     = 0;
let pizzaCount = 0;
let highScore = parseInt(localStorage.getItem('jeffrey_hs') || '0');
let gameSpeed = 1.0;
let worldX    = 0;       // total world scroll
let gt        = 0;       // cumulative seconds
let lastTs    = 0;
let isNewRecord = false;

// Jeffrey
const jef = {
  lane: 2, visY: LANE_CENTERS[2], fromY: LANE_CENTERS[2], toY: LANE_CENTERS[2],
  jumping: false, jumpT: 0, hopT: -1, alive: true, deathT: 0
};

let obstacles = [], pizzas = [], bld1 = [], bld2 = [], confetti = [];
let nextSpawn = {}, nextPizzaX = 0;
let buttons = [];

// ============================================================
// UTILITY
// ============================================================
function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function inRect(px, py, x, y, w, h) {
  return px >= x && px <= x + w && py >= y && py <= y + h;
}

function easeOut3(t) { return 1 - Math.pow(1 - Math.min(t, 1), 3); }

// ============================================================
// BUILDINGS GENERATION
// ============================================================
function makeBuilding(wx, far) {
  const w = far ? 110 + Math.random() * 110 : 80 + Math.random() * 90;
  const h = far ? 110 + Math.random() * 220 : 80 + Math.random() * 130;
  const color = BCOLORS[Math.floor(Math.random() * BCOLORS.length)];
  const sign  = far ? null : SIGNS[Math.floor(Math.random() * SIGNS.length)];
  const wins  = [];
  const cols  = Math.floor(w / (far ? 36 : 30));
  const rows  = Math.floor(h / (far ? 42 : 36));
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      wins.push({ x: 8 + c * (far ? 36 : 30), y: 8 + r * (far ? 42 : 36), w: far ? 22 : 18, h: far ? 26 : 22 });
  return { wx, w, h, color, sign, wins };
}

function generateBuildings() {
  bld1 = []; bld2 = [];
  let x1 = -300, x2 = -200;
  while (x1 < 8000) { const b = makeBuilding(x1, true);  bld1.push(b); x1 += b.w + 6 + Math.random() * 80; }
  while (x2 < 8000) { const b = makeBuilding(x2, false); bld2.push(b); x2 += b.w + 5 + Math.random() * 60; }
}

function extendBuildings() {
  // Far layer (parallax 0.3)
  const viewFar = (worldX + CANVAS_W) / 0.3 + 600;
  if (bld1.length > 0) {
    let last = bld1[bld1.length - 1];
    while (last.wx + last.w < viewFar) {
      const b = makeBuilding(last.wx + last.w + 6 + Math.random() * 70, true);
      bld1.push(b); last = b;
    }
  }
  // Near layer (parallax 0.6)
  const viewNear = (worldX + CANVAS_W) / 0.6 + 400;
  if (bld2.length > 0) {
    let last = bld2[bld2.length - 1];
    while (last.wx + last.w < viewNear) {
      const b = makeBuilding(last.wx + last.w + 5 + Math.random() * 50, false);
      bld2.push(b); last = b;
    }
  }
}

// ============================================================
// RENDERING — BACKGROUND
// ============================================================
function drawBackground() {
  // Sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, LANE_TOP);
  sky.addColorStop(0, C.skyTop);
  sky.addColorStop(1, C.skyBot);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, CANVAS_W, LANE_TOP);

  // Far buildings
  const p1 = worldX * 0.3;
  for (const b of bld1) {
    const bx = Math.round(b.wx - p1);
    if (bx + b.w < 0 || bx > CANVAS_W) continue;
    ctx.fillStyle = b.color;
    ctx.fillRect(bx, LANE_TOP - b.h, b.w, b.h);
    ctx.fillStyle = 'rgba(255,230,150,0.45)';
    for (const w of b.wins) ctx.fillRect(bx + w.x, LANE_TOP - b.h + w.y, w.w, w.h);
  }

  // Near buildings
  const p2 = worldX * 0.6;
  for (const b of bld2) {
    const bx = Math.round(b.wx - p2);
    if (bx + b.w < 0 || bx > CANVAS_W) continue;
    ctx.fillStyle = b.color;
    ctx.fillRect(bx, LANE_TOP - b.h, b.w, b.h);
    ctx.fillStyle = 'rgba(255,210,120,0.65)';
    for (const w of b.wins) ctx.fillRect(bx + w.x, LANE_TOP - b.h + w.y, w.w, w.h);
    if (b.sign) {
      ctx.fillStyle = C.red;
      ctx.fillRect(bx + 6, LANE_TOP - b.h * 0.52, b.w - 12, 26);
      ctx.fillStyle = C.cream;
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(b.sign, bx + b.w / 2, LANE_TOP - b.h * 0.52 + 18);
    }
  }

  // Bottom strip
  ctx.fillStyle = '#2A2A2A';
  ctx.fillRect(0, LANE_TOP + NUM_LANES * LANE_H, CANVAS_W, CANVAS_H - (LANE_TOP + NUM_LANES * LANE_H));
}

// ============================================================
// RENDERING — LANES
// ============================================================
function drawLanes() {
  const dashOff = -(worldX % 70);

  for (let i = 0; i < NUM_LANES; i++) {
    const ly = LANE_TOP + i * LANE_H;
    const type = LANE_TYPE[i];

    if (type === 'walk') {
      ctx.fillStyle = C.sidewalk;
      ctx.fillRect(0, ly, CANVAS_W, LANE_H);
      // Cobblestone grid
      ctx.strokeStyle = 'rgba(0,0,0,0.12)';
      ctx.lineWidth = 1;
      const tw = 42, th = 32;
      for (let tx = -(worldX % tw); tx < CANVAS_W + tw; tx += tw) {
        ctx.beginPath(); ctx.moveTo(tx, ly); ctx.lineTo(tx, ly + LANE_H); ctx.stroke();
      }
      for (let ty = 0; ty < LANE_H; ty += th) {
        ctx.beginPath(); ctx.moveTo(0, ly + ty); ctx.lineTo(CANVAS_W, ly + ty); ctx.stroke();
      }
    } else {
      ctx.fillStyle = C.asphalt;
      ctx.fillRect(0, ly, CANVAS_W, LANE_H);
      // Edge lines
      ctx.strokeStyle = '#DDDD00';
      ctx.lineWidth = 3;
      ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(CANVAS_W, ly); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, ly + LANE_H); ctx.lineTo(CANVAS_W, ly + LANE_H); ctx.stroke();
      // Dashed center
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 3;
      ctx.setLineDash([40, 32]);
      ctx.lineDashOffset = dashOff;
      ctx.beginPath();
      ctx.moveTo(0, ly + LANE_H / 2);
      ctx.lineTo(CANVAS_W, ly + LANE_H / 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }
}

// ============================================================
// RENDERING — JEFFREY
// ============================================================
function drawJeffrey() {
  const cx = JEFFREY_X;
  const cy = jef.visY;
  const bob = Math.sin(gt * 3.2) * 3.5;
  const hopOff = jef.hopT >= 0 ? -Math.sin(jef.hopT * Math.PI) * 22 : 0;

  ctx.save();
  ctx.translate(cx, cy + bob + hopOff);

  if (!jef.alive) {
    ctx.rotate(jef.deathT * Math.PI * 0.7);
    ctx.globalAlpha = Math.max(0, 1 - jef.deathT * 0.6);
  }

  // Surfboard shadow
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  rr(ctx, -38, 58, 76, 10, 5);
  ctx.fill();

  // Surfboard
  ctx.fillStyle = C.yellow;
  rr(ctx, -42, 50, 84, 20, 9);
  ctx.fill();
  ctx.strokeStyle = C.red;
  ctx.lineWidth = 3;
  rr(ctx, -42, 50, 84, 20, 9);
  ctx.stroke();
  // Board stripe
  ctx.fillStyle = C.red;
  ctx.fillRect(-42, 57, 84, 6);
  // Board fin
  ctx.fillStyle = C.orange;
  ctx.beginPath();
  ctx.moveTo(35, 70); ctx.lineTo(42, 85); ctx.lineTo(28, 70);
  ctx.closePath(); ctx.fill();

  // Legs (jeans)
  ctx.fillStyle = '#3A5F8A';
  ctx.fillRect(-18, 28, 14, 25);
  ctx.fillRect(4, 28, 14, 25);
  // Shoes
  ctx.fillStyle = '#111';
  rr(ctx, -20, 46, 16, 9, 3);
  ctx.fill();
  rr(ctx, 4, 46, 16, 9, 3);
  ctx.fill();

  // Body — red shirt
  ctx.fillStyle = C.red;
  rr(ctx, -24, -22, 48, 54, 9);
  ctx.fill();

  // Pizza logo on shirt
  ctx.fillStyle = C.orange;
  ctx.beginPath();
  ctx.moveTo(0, -12); ctx.lineTo(-11, 6); ctx.lineTo(11, 6);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.yellow;
  ctx.beginPath(); ctx.arc(-2, 2, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(5, -3, 2.5, 0, Math.PI * 2); ctx.fill();

  // Arms
  ctx.fillStyle = C.skin;
  rr(ctx, -36, -18, 14, 32, 5); ctx.fill();
  rr(ctx, 22, -18, 14, 32, 5); ctx.fill();

  // Neck
  ctx.fillStyle = C.skin;
  ctx.fillRect(-8, -28, 16, 10);

  // Head
  ctx.fillStyle = C.skin;
  ctx.beginPath();
  ctx.arc(0, -40, 26, 0, Math.PI * 2);
  ctx.fill();

  // Hair
  ctx.fillStyle = '#3D2000';
  ctx.beginPath();
  ctx.arc(0, -52, 20, Math.PI, Math.PI * 2);
  ctx.fill();
  ctx.fillRect(-20, -56, 40, 16);
  // Hair tuft
  ctx.beginPath();
  ctx.arc(0, -66, 8, Math.PI, Math.PI * 2);
  ctx.fill();

  // Eyes
  ctx.fillStyle = C.white;
  rr(ctx, -13, -48, 10, 8, 2); ctx.fill();
  rr(ctx, 3, -48, 10, 8, 2); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(-8, -44, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(8, -44, 3.5, 0, Math.PI * 2); ctx.fill();
  // Pupils highlight
  ctx.fillStyle = C.white;
  ctx.beginPath(); ctx.arc(-6.5, -45.5, 1.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(9.5, -45.5, 1.2, 0, Math.PI * 2); ctx.fill();

  // Smile
  ctx.strokeStyle = '#552200';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, -30, 10, 0.25, Math.PI - 0.25);
  ctx.stroke();

  ctx.restore();
}

// ============================================================
// RENDERING — OBSTACLES
// ============================================================
function drawObstacles() {
  for (const obs of obstacles) {
    const sx = Math.round(obs.wx - worldX + JEFFREY_X);
    if (sx + obs.w < -30 || sx > CANVAS_W + 30) continue;
    const sy = LANE_CENTERS[obs.lane];
    ctx.save();
    ctx.translate(sx + obs.w / 2, sy);
    if (obs.type === 'taxi')  drawTaxi(obs.w, obs.h, obs.speed < 0);
    if (obs.type === 'trash') drawTrash(obs.w, obs.h);
    if (obs.type === 'chair') drawChair(obs.w, obs.h);
    if (obs.type === 'ped')   drawPed(obs.w, obs.h);
    ctx.restore();
  }
}

function drawTaxi(w, h, facingLeft) {
  if (facingLeft) ctx.scale(-1, 1);
  const hw = w / 2, hh = h / 2;
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  rr(ctx, -hw + 4, hh - 6, w - 8, 12, 6); ctx.fill();
  // Body
  ctx.fillStyle = C.yellow;
  rr(ctx, -hw, -hh, w, h, 10); ctx.fill();
  ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
  rr(ctx, -hw, -hh, w, h, 10); ctx.stroke();
  // Roof
  ctx.fillStyle = '#D4A800';
  rr(ctx, -hw + 14, -hh, w - 28, h * 0.45, 8); ctx.fill();
  // Windows
  ctx.fillStyle = '#7EC8E3';
  ctx.fillRect(-hw + 16, -hh + 5, w * 0.32, h * 0.28);
  ctx.fillRect(hw - 16 - w * 0.28, -hh + 5, w * 0.28, h * 0.28);
  // Wheels
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(-hw + 18, hh, 12, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(hw - 18, hh, 12, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#888';
  ctx.beginPath(); ctx.arc(-hw + 18, hh, 5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(hw - 18, hh, 5, 0, Math.PI * 2); ctx.fill();
  // TAXI sign
  ctx.fillStyle = '#333';
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('TAXI', 0, -hh + 44);
  // Headlight
  ctx.fillStyle = '#FFFFAA';
  ctx.fillRect(hw - 10, -6, 10, 12);
}

function drawTrash(w, h) {
  const hw = w / 2, hh = h / 2;
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(0, hh + 3, hw - 4, 6, 0, 0, Math.PI * 2); ctx.fill();
  // Body
  ctx.fillStyle = '#4A4A4A';
  rr(ctx, -hw, -hh + 10, w, h - 10, 5); ctx.fill();
  ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
  rr(ctx, -hw, -hh + 10, w, h - 10, 5); ctx.stroke();
  // Horizontal bands
  ctx.strokeStyle = '#666'; ctx.lineWidth = 2;
  for (let y = 0; y < 3; y++) {
    ctx.beginPath();
    ctx.moveTo(-hw, -hh + 20 + y * 18);
    ctx.lineTo(hw, -hh + 20 + y * 18);
    ctx.stroke();
  }
  // Lid
  ctx.fillStyle = '#666';
  rr(ctx, -hw - 4, -hh, w + 8, 14, 3); ctx.fill();
  ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
  rr(ctx, -hw - 4, -hh, w + 8, 14, 3); ctx.stroke();
  // Handle
  ctx.strokeStyle = '#999'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(0, -hh - 2, 11, Math.PI, Math.PI * 2);
  ctx.stroke();
}

function drawChair(w, h) {
  const hw = w / 2, hh = h / 2;
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath(); ctx.ellipse(0, hh + 3, hw, 6, 0, 0, Math.PI * 2); ctx.fill();
  // Legs
  ctx.fillStyle = '#7A4A20';
  ctx.fillRect(-hw, -hh + 42, 7, h - 42);
  ctx.fillRect(hw - 7, -hh + 42, 7, h - 42);
  ctx.fillRect(-hw, -hh + 2, 7, 38);
  ctx.fillRect(hw - 7, -hh + 2, 7, 38);
  // Back rest
  ctx.fillStyle = C.orange;
  rr(ctx, -hw, -hh, w, 44, 6); ctx.fill();
  ctx.strokeStyle = '#7A4A20'; ctx.lineWidth = 2;
  rr(ctx, -hw, -hh, w, 44, 6); ctx.stroke();
  // Seat
  ctx.fillStyle = '#CC8844';
  rr(ctx, -hw, -hh + 38, w, 16, 4); ctx.fill();
  // Cushion stripe
  ctx.fillStyle = C.red;
  ctx.fillRect(-hw + 4, -hh + 8, w - 8, 6);
  ctx.fillRect(-hw + 4, -hh + 22, w - 8, 6);
}

function drawPed(w, h) {
  const hh = h / 2;
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath(); ctx.ellipse(0, hh + 3, 14, 5, 0, 0, Math.PI * 2); ctx.fill();
  // Legs
  ctx.fillStyle = '#2A2A5A';
  ctx.fillRect(-10, -hh + 60, 8, 30);
  ctx.fillRect(2, -hh + 60, 8, 30);
  // Body
  ctx.fillStyle = C.green;
  rr(ctx, -14, -hh + 26, 28, 38, 6); ctx.fill();
  // Arms
  ctx.fillStyle = C.skin;
  ctx.fillRect(-22, -hh + 28, 9, 28);
  ctx.fillRect(13, -hh + 28, 9, 28);
  // Head
  ctx.fillStyle = C.skin;
  ctx.beginPath(); ctx.arc(0, -hh + 16, 20, 0, Math.PI * 2); ctx.fill();
  // Hair
  ctx.fillStyle = '#333';
  ctx.beginPath(); ctx.arc(0, -hh + 8, 16, Math.PI, Math.PI * 2); ctx.fill();
}

// ============================================================
// RENDERING — PIZZA COLLECTIBLES
// ============================================================
function drawPizzas() {
  for (const p of pizzas) {
    const sx = Math.round(p.wx - worldX + JEFFREY_X);
    if (sx < -60 || sx > CANVAS_W + 60) continue;
    const sy = LANE_CENTERS[p.lane];

    // Glow
    ctx.save();
    ctx.globalAlpha = 0.3 + Math.sin(gt * 4 + p.wx * 0.01) * 0.15;
    ctx.fillStyle = C.yellow;
    ctx.beginPath(); ctx.arc(sx, sy, 32, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(p.angle);
    // Crust
    ctx.fillStyle = '#C8843A';
    ctx.beginPath();
    ctx.moveTo(0, -30); ctx.lineTo(-24, 20); ctx.lineTo(24, 20);
    ctx.closePath(); ctx.fill();
    // Sauce
    ctx.fillStyle = C.red;
    ctx.beginPath();
    ctx.moveTo(0, -20); ctx.lineTo(-17, 14); ctx.lineTo(17, 14);
    ctx.closePath(); ctx.fill();
    // Cheese blobs
    ctx.fillStyle = C.yellow;
    ctx.beginPath(); ctx.arc(-5, 2, 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(7, -6, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(1, 11, 4, 0, Math.PI * 2); ctx.fill();
    // Pepperoni
    ctx.fillStyle = '#A82020';
    ctx.beginPath(); ctx.arc(-6, -5, 3, 0, Math.PI * 2); ctx.fill();
    // Outline
    ctx.strokeStyle = 'rgba(0,0,0,0.3)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, -30); ctx.lineTo(-24, 20); ctx.lineTo(24, 20);
    ctx.closePath(); ctx.stroke();
    ctx.restore();
  }
}

// ============================================================
// RENDERING — HUD
// ============================================================
function drawHUD() {
  // HUD background
  ctx.fillStyle = 'rgba(20, 12, 5, 0.93)';
  ctx.fillRect(0, 0, CANVAS_W, 155);
  // Bottom border
  ctx.fillStyle = C.red;
  ctx.fillRect(0, 152, CANVAS_W, 3);

  ctx.textAlign = 'left';

  if (mode === 'task') {
    // Score progress bar
    ctx.fillStyle = C.cream;
    ctx.font = 'bold 18px sans-serif';
    ctx.fillText(`Шаги  ${score} / ${GOAL_SCORE}`, 30, 38);
    drawBar(30, 46, 300, 20, score / GOAL_SCORE, C.orange);

    // Pizza progress bar
    ctx.fillStyle = C.cream;
    ctx.fillText(`Пицца  ${pizzaCount} / ${GOAL_PIZZA}`, 390, 38);
    drawBar(390, 46, 300, 20, pizzaCount / GOAL_PIZZA, C.red);

    // Pizza icons
    ctx.font = '20px sans-serif';
    let icons = '';
    for (let i = 0; i < GOAL_PIZZA; i++) icons += i < pizzaCount ? '🍕' : '◻';
    ctx.fillStyle = C.cream;
    ctx.fillText(icons, 390, 100);

    // Speed badge
    ctx.fillStyle = gameSpeed > 1.5 ? C.red : C.orange;
    ctx.textAlign = 'right';
    ctx.font = 'bold 18px sans-serif';
    ctx.fillText('x' + gameSpeed.toFixed(1), 355, 100);

// ============================================================
// GAME LOGIC
// ============================================================
function startGame(m) {
  mode = m;
  screen = 'playing';
  score = 0; pizzaCount = 0;
  gameSpeed = 1.0;
  worldX = 0;
  isNewRecord = false;

  Object.assign(jef, {
    lane: 2,
    visY: LANE_CENTERS[2], fromY: LANE_CENTERS[2], toY: LANE_CENTERS[2],
    jumping: false, jumpT: 0, hopT: -1, alive: true, deathT: 0
  });

  obstacles = []; pizzas = []; confetti = [];
  nextSpawn = {};
  for (let i = 0; i < NUM_LANES; i++) {
    nextSpawn[i] = JEFFREY_X + 300 + Math.random() * 200;
  }
  nextPizzaX = worldX + CANVAS_W + 100;

  generateBuildings();
  buttons = [];
}

function spawnObstacle(lane) {
  const type = LANE_TYPE[lane];
  const dir  = LANE_DIR[lane];
  let obsType, w, h, speed;

  if (type === 'walk') {
    if (Math.random() < 0.55) {
      obsType = 'ped';
      w = 44; h = 96;
      speed = (Math.random() < 0.5 ? -1 : 1) * (50 + Math.random() * 55);
    } else {
      obsType = 'chair';
      w = 62; h = 82;
      speed = 0;
    }
  } else {
    const r = Math.random();
    if (r < 0.55) { obsType = 'taxi';  w = 136; h = 82; }
    else if (r < 0.80) { obsType = 'trash'; w = 54; h = 74; }
    else { obsType = 'chair'; w = 62; h = 82; }
    speed = dir * (175 + Math.random() * 130);
  }

  const wx = worldX + CANVAS_W + 80 + Math.random() * 120;
  obstacles.push({ type: obsType, lane, wx, speed, w, h });
}

function generateContent() {
  for (let lane = 0; lane < NUM_LANES; lane++) {
    if (nextSpawn[lane] === undefined) nextSpawn[lane] = worldX + CANVAS_W;
    if (nextSpawn[lane] < worldX + SPAWN_AHEAD) {
      spawnObstacle(lane);
      const gap = (MIN_GAP + Math.random() * (MAX_GAP - MIN_GAP)) / gameSpeed;
      nextSpawn[lane] = worldX + CANVAS_W + gap + Math.random() * 80;
    }
  }
  while (nextPizzaX < worldX + SPAWN_AHEAD) {
    const lane = Math.floor(Math.random() * NUM_LANES);
    pizzas.push({ lane, wx: nextPizzaX + Math.random() * 200, angle: 0 });
    nextPizzaX += PIZZA_INTERVAL / gameSpeed + Math.random() * 400;
  }
  extendBuildings();
}

function doJump(dir) {
  if (!jef.alive || screen !== 'playing') return;
  if (dir === 'forward') {
    worldX += TILE_STEP;
    score++;
    jef.hopT = 0;
    updateDifficulty();
  } else if (dir === 'back') {
    worldX = Math.max(0, worldX - Math.round(TILE_STEP * 0.4));
  } else if ((dir === 'up' || dir === 'down') && !jef.jumping) {
    const next = jef.lane + (dir === 'up' ? -1 : 1);
    if (next >= 0 && next < NUM_LANES) {
      jef.fromY = jef.visY;
      jef.lane  = next;
      jef.toY   = LANE_CENTERS[next];
      jef.jumping = true;
      jef.jumpT = 0;
    }
  }
}

function updateJeffrey(dt) {
  if (jef.jumping) {
    jef.jumpT += dt / (BASE_JUMP_MS / 1000);
    jef.visY = jef.fromY + (jef.toY - jef.fromY) * easeOut3(jef.jumpT);
    if (jef.jumpT >= 1) { jef.jumping = false; jef.visY = jef.toY; }
  }
  if (jef.hopT >= 0) {
    jef.hopT += dt / 0.14;
    if (jef.hopT >= 1) jef.hopT = -1;
  }
  if (!jef.alive) {
    jef.deathT = Math.min(jef.deathT + dt * 1.6, 1);
  }
}

function updateObstacles(dt) {
  for (const obs of obstacles) obs.wx += obs.speed * gameSpeed * dt;
  for (const p of pizzas) p.angle += dt * 2.2;

  // Cull distant objects
  obstacles = obstacles.filter(o => {
    const sx = o.wx - worldX + JEFFREY_X;
    return sx > -250 && sx < CANVAS_W + 350;
  });
  pizzas = pizzas.filter(p => {
    const sx = p.wx - worldX + JEFFREY_X;
    return sx > -120 && sx < CANVAS_W + 200;
  });
}

function updateDifficulty() {
  gameSpeed = Math.min(1 + Math.floor(score / 20) * 0.15, 3.0);
}

function checkCollisions() {
  if (!jef.alive) return;
  const jcx = JEFFREY_X;
  const jcy = jef.visY;
  const JHW = 22, JHH = 36;

  for (const obs of obstacles) {
    // Check current lane + target lane during jump
    const matchLane = obs.lane === jef.lane ||
      (jef.jumping && obs.lane === (jef.toY < jef.fromY ? jef.lane + 1 : jef.lane - 1));
    if (!matchLane) continue;

    const sx = obs.wx - worldX + JEFFREY_X;
    const ocy = LANE_CENTERS[obs.lane];
    if (jcx + JHW > sx - obs.w / 2 &&
        jcx - JHW < sx + obs.w / 2 &&
        jcy + JHH > ocy - obs.h / 2 &&
        jcy - JHH < ocy + obs.h / 2) {
      gameOver();
      return;
    }
  }

  // Pizza pickup
  for (let i = pizzas.length - 1; i >= 0; i--) {
    const p = pizzas[i];
    if (p.lane !== jef.lane) continue;
    const sx = p.wx - worldX + JEFFREY_X;
    if (Math.abs(sx - jcx) < 38 && Math.abs(LANE_CENTERS[p.lane] - jcy) < 44) {
      pizzas.splice(i, 1);
      pizzaCount++;
    }
  }
}

function gameOver() {
  jef.alive = false;
  screen = 'dead';
  isNewRecord = false;
  if (mode === 'record' && score > highScore) {
    highScore = score;
    localStorage.setItem('jeffrey_hs', highScore);
    isNewRecord = true;
  }
}

function triggerWin() {
  screen = 'win';
  spawnConfettiParticles(160);
}

function spawnConfettiParticles(n) {
  const cols = [C.red, C.orange, C.green, C.cream, C.yellow, '#FF69B4', '#00BFFF', '#9B5DE5'];
  for (let i = 0; i < n; i++) {
    confetti.push({
      x: Math.random() * CANVAS_W,
      y: -20 - Math.random() * 120,
      vx: (Math.random() - 0.5) * 320,
      vy: 160 + Math.random() * 280,
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 9,
      color: cols[Math.floor(Math.random() * cols.length)],
      w: 8 + Math.random() * 11,
      h: 5 + Math.random() * 9,
      alpha: 1,
    });
  }
}

function updateConfetti(dt) {
  for (const c of confetti) {
    c.x  += c.vx * dt;
    c.y  += c.vy * dt;
    c.vy += 90 * dt;
    c.rot += c.rotV * dt;
    if (c.y > CANVAS_H + 20) {
      c.y = -20; c.x = Math.random() * CANVAS_W;
      c.vy = 160 + Math.random() * 200;
      c.vx = (Math.random() - 0.5) * 250;
    }
  }
}

// ============================================================
// INPUT
// ============================================================
document.addEventListener('keydown', e => {
  if (screen === 'start' || screen === 'dead' || screen === 'win') return;
  const k = e.key;
  if (k === 'ArrowUp'    || k === 'w' || k === 'W') { doJump('up');      e.preventDefault(); }
  if (k === 'ArrowDown'  || k === 's' || k === 'S') { doJump('down');    e.preventDefault(); }
  if (k === 'ArrowRight' || k === 'd' || k === 'D') { doJump('forward'); e.preventDefault(); }
  if (k === 'ArrowLeft'  || k === 'a' || k === 'A') { doJump('back');    e.preventDefault(); }
  if (k === 'Escape' || k === 'p' || k === 'P') {
    if (screen === 'playing') screen = 'paused';
    else if (screen === 'paused') screen = 'playing';
    e.preventDefault();
  }
});

let tx0 = 0, ty0 = 0, tts = 0;
canvas.addEventListener('touchstart', e => {
  tx0 = e.touches[0].clientX;
  ty0 = e.touches[0].clientY;
  tts = Date.now();
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx0;
  const dy = e.changedTouches[0].clientY - ty0;
  const elapsed = Date.now() - tts;
  const THRESH = 28;

  if (Math.abs(dx) < THRESH && Math.abs(dy) < THRESH && elapsed < 300) {
    // Tap = button click
    const rect = canvas.getBoundingClientRect();
    const sx = CANVAS_W / rect.width, sy = CANVAS_H / rect.height;
    const cx = (e.changedTouches[0].clientX - rect.left) * sx;
    const cy = (e.changedTouches[0].clientY - rect.top)  * sy;
    handleClick(cx, cy);
    e.preventDefault(); return;
  }

  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx >  THRESH) doJump('forward');
    else if (dx < -THRESH) doJump('back');
  } else {
    if (dy < -THRESH) doJump('up');
    else if (dy >  THRESH) doJump('down');
  }
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const cx = (e.clientX - rect.left) * (CANVAS_W / rect.width);
  const cy = (e.clientY - rect.top)  * (CANVAS_H / rect.height);
  handleClick(cx, cy);
});

// ============================================================
// UI CLICK HANDLING
// ============================================================
function handleClick(cx, cy) {
  if (screen === 'playing') {
    if (cx > CANVAS_W / 2 - 44 && cx < CANVAS_W / 2 + 44 && cy < 155) {
      screen = 'paused'; return;
    }
    // On playing screen, right-side tap = jump forward
    if (cx > CANVAS_W / 2 && cy > 155) { doJump('forward'); return; }
    if (cy > 155) { doJump(cy < CANVAS_H / 2 ? 'up' : 'down'); return; }
  }
  for (const btn of buttons) {
    if (inRect(cx, cy, btn.x, btn.y, btn.w, btn.h)) {
      triggerButton(btn.id); return;
    }
  }
}

function triggerButton(id) {
  switch (id) {
    case 'task':    startGame('task');   break;
    case 'record':  startGame('record'); break;
    case 'restart': startGame(mode);     break;
    case 'menu':    screen = 'start'; buttons = []; break;
    case 'resume':  screen = 'playing';  buttons = []; break;
    case 'back':
      if (IS_IFRAME) window.parent.postMessage({ type: 'jeffrey:exit' }, '*');
      break;
  }
}

// ============================================================
// GAME LOOP
// ============================================================
function loop(ts) {
  const dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs = ts;
  gt += dt;

  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

  if (screen === 'playing') {
    updateJeffrey(dt);
    updateObstacles(dt);
    generateContent();
    checkCollisions();
    if (mode === 'task' && jef.alive && score >= GOAL_SCORE && pizzaCount >= GOAL_PIZZA) triggerWin();
  } else if (screen === 'dead') {
    updateJeffrey(dt);
  } else if (screen === 'win') {
    updateConfetti(dt);
  }

  if (screen !== 'start') {
    drawBackground();
    drawLanes();
    drawPizzas();
    drawObstacles();
    drawJeffrey();
    drawHUD();
  }

  if (screen === 'start')  drawStartScreen();
  if (screen === 'paused') drawPauseScreen();
  if (screen === 'dead')   drawDeathScreen();
  if (screen === 'win')    drawWinScreen();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
